# Build the wash RISC-V browser demo and deploy it to GitHub Pages.
#
# Triggers:
#   * push to main → rebuild + deploy (EVERY push, so the demo always
#     mirrors main)
#   * pull_request to main → build-only sanity check (no deploy)
#   * workflow_dispatch (manual re-run from the Actions tab)
#
# Build path mirrors wash-vm/web/README.md § "Deploy as static HTML":
#   1. Build the wash shell bundle (web/shell → dist/)
#   2. Build the VM artifacts (kernel + firmware + rootfs + wasm)
#      via `make -C wash-vm/image all` — four Docker containers
#   3. Vite-build the host page with --base set to the GH Pages URL
#   4. Stage the shell bundle + chrome SVGs into dist/, prune the
#      duplicates Vite copies in
#   5. Upload as a Pages artifact, deploy
#
# First-time setup (one-off, on the repo's Settings page):
#   Settings → Pages → Source: GitHub Actions
#
# Cold build is ~25-35 min (kernel is the slow one). Subsequent runs
# hit Docker layer cache via setup-buildx-action and are ~5-10 min.

name: demo

on:
  # Rebuild + redeploy the live demo when something that affects it changes —
  # app/shell/VM code, not docs or native-packaging. The demo bakes the
  # multicall wash binary + the shell bundle, so any Go/TS/FE change matters;
  # *.md / docs / packaging / the OTHER workflows don't. paths-ignore errs
  # toward running (a mixed push still builds), so the live demo never goes
  # stale — it just stops rebuilding for doc/packaging-only pushes.
  push:
    branches: [main]
    paths-ignore: &demo-ignore
      - '**.md'
      - 'docs/**'
      - 'packaging/**'
      - 'debian/**'
      - 'rpm/**'
      - 'alpine/**'
      - 'e2e/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/prebuild.yml'
  pull_request:
    branches: [main]
    paths-ignore: *demo-ignore
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write   # to comment on PRs with the artifact link

# A new push supersedes an in-flight build: cancel it (per-ref) so a burst of
# commits only builds+deploys the LATEST instead of queuing every one (the old
# fixed-group + cancel:false ran them all back-to-back — ~18 min each). Per-ref
# so a PR build never cancels a main deploy; Pages-deploy serialization is
# handled separately by the github-pages environment.
concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - uses: docker/setup-buildx-action@v4

      # The workspace packages (web/shell, web/lib, apps/*/fe).
      - name: pnpm install (workspace)
        run: pnpm install --frozen-lockfile

      # wash-vm/web is intentionally outside the pnpm workspace
      # (different stack — vite + tsc only, no @wash/* deps), but
      # the root pnpm-workspace.yaml's reach means a plain
      # `pnpm install` here would walk UP, treat the workspace as
      # the install target, and no-op for wash-vm/web (left with
      # an empty node_modules and `vite` not on PATH for the next
      # step). --ignore-workspace forces pnpm to treat the cwd
      # package.json as the install root. No lockfile is checked
      # in for wash-vm/web yet — once it stabilises we can add
      # --frozen-lockfile, until then accept a fresh resolve.
      - name: pnpm install (wash-vm/web)
        working-directory: wash-vm/web
        run: pnpm install --ignore-workspace --no-frozen-lockfile

      - name: Build wash shell
        run: pnpm -F @wash/shell build

      # Try to pull the rarely-changing blobs (kernel + firmware +
      # wasm) from the vm-blobs Release maintained by prebuild.yml.
      # On the first run (no release yet) this fails harmlessly and
      # the fallback below builds them from source.
      - name: Download prebuilt VM blobs
        id: blobs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          mkdir -p wash-vm/image/dist
          cd wash-vm/image/dist
          gh release download vm-blobs \
            --pattern 'Image' \
            --pattern 'fw_jump.bin' \
            --pattern 'riscvemu64-wasm.js' \
            --pattern 'riscvemu64-wasm.wasm' \
            --clobber
          echo "Downloaded blobs:"
          ls -lh Image fw_jump.bin riscvemu64-wasm.js riscvemu64-wasm.wasm

      # Cold-path fallback: build kernel + firmware + wasm from
      # source. Only runs when the download step failed (e.g. first
      # ever workflow run, or someone deleted the release). Takes
      # ~25 min; the prebuild workflow exists specifically to skip
      # this on subsequent runs.
      - name: Build kernel + firmware + wasm (fallback)
        if: steps.blobs.outcome == 'failure'
        run: make -C wash-vm/image kernel firmware wasm

      # Rootfs is the per-push variable piece (changes on every app
      # commit). Always built locally. Install copies everything
      # under wash-vm/image/dist/ → web/public/tinyemu/.
      - name: Build rootfs + install
        run: make -C wash-vm/image rootfs install

      - name: Vite-build host page
        working-directory: wash-vm/web
        # --base must match the GitHub Pages URL so the bundled
        # asset paths resolve. github.event.repository.name is
        # the repo slug ("wash" → /wash/). Custom domain? Drop
        # the flag entirely.
        run: pnpm exec vite build --base=/${{ github.event.repository.name }}/

      - name: Stage static dist
        working-directory: wash-vm/web
        run: |
          set -euo pipefail
          mkdir -p dist/shell
          cp -a ../../web/shell/dist/. dist/shell/
          # icons.svg / wash-logo.svg now ship from the shell build output
          # (web/shell/dist) — the old internal/runner/router/assets path is gone.
          cp ../../web/shell/dist/icons.svg dist/
          cp ../../web/shell/dist/wash-logo.svg dist/
          rm -f dist/tinyemu/riscvemu64-wasm.{js,wasm}.{broken-dev,prod}
          rm -f dist/v86.wasm
          rm -f dist/tinyemu/wash-rootfs.ext2
          echo "Final dist size:"
          du -sh dist/

      # Pages artifact — only consumed by the deploy job on main.
      # Skipped on PRs since they don't deploy.
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: wash-vm/web/dist

      # Downloadable workflow artifact — always uploaded so PR
      # authors (and post-mortem debuggers) can grab the exact
      # built bytes from the Actions UI / `gh run download`. Lives
      # 7 days by default.
      - uses: actions/upload-artifact@v7
        with:
          name: demo-dist-${{ github.run_id }}
          path: wash-vm/web/dist
          if-no-files-found: error
          retention-days: 7

      # PR feedback. On a successful build we leave a single
      # sticky comment with the dist size + a link to the
      # artifact, so a reviewer doesn't have to dig through the
      # Actions tab. The marker comment is recognised and
      # rewritten in place on subsequent pushes to the same PR.
      - if: github.event_name == 'pull_request'
        name: Comment artifact link on PR
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: demo-build
          message: |
            ✅ **Demo build green.**

            * Run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            * Artifact: `demo-dist-${{ github.run_id }}` — download from the run page, unzip, `python3 -m http.server` to preview locally.
            * The deployed copy at <https://sirmick.github.io/wash/> stays on the last `main` build until this PR merges.

  deploy:
    # Only deploy on main; PRs build-only (artifact only).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
