# wash CI — build → test → package, the same `make` verbs you run locally.
#
#   unit     → make unit-test   (build + go vet + go test ./... + FE-unit + component)
#   e2e      → make e2e-test     (build test-app + Playwright)
#   package  → make <amd64>-<distro>-wash-package   (needs: tests pass first)
#
# amd64-only to start (no qemu emulation → fast). The kvm tiers (net-test /
# disks-test) can't run on GH runners and stay local. The browser-VM demo +
# its prebuild blobs live in demo.yml / prebuild.yml (unrelated to this pipeline).
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A new push to a branch/PR supersedes the in-flight run for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (go + fe)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: pnpm install (workspace)
        run: pnpm install --frozen-lockfile
      - name: make unit-test
        run: make unit-test
      - name: make test-race (go unit suite under the race detector)
        run: make test-race

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: pnpm install (workspace)
        run: pnpm install --frozen-lockfile
      - name: pnpm install (e2e — standalone, outside the workspace)
        run: pnpm --dir e2e install --ignore-workspace --frozen-lockfile
      - name: Install Playwright Chromium (+ system deps)
        run: pnpm --dir e2e exec playwright install --with-deps chromium
      - name: make e2e-test (multicall — the shipped layout, full suite)
        run: make e2e-test
      - name: make standalone-smoke (per-app-binary layout smoke)
        run: make standalone-smoke
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  package:
    name: package
    runs-on: ubuntu-24.04
    needs: [unit, e2e]   # only package a green build
    # 60 (not 30) to cover the arm64 deb row, which compiles under qemu emulation.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - amd64-ubuntu24-wash-package
          - amd64-debian13-wash-package
          # arm64 Debian deb: consumed by the MikroTik OCI image downstream. Only
          # the debian/arm64 row is emulated here (not the full arm64 matrix) — it's
          # the one a downstream actually ships. Slower (qemu); see setup-qemu below.
          - arm64-debian13-wash-package
          - amd64-fedora40-wash-package
          - amd64-alpine321-wash-package
          - openwrt-smoke
    steps:
      - uses: actions/checkout@v7
      # arm64 rows build inside an emulated linux/arm64 container; register the
      # binfmt handlers first. No-op cost on amd64 rows, so gate it to keep them lean.
      - if: ${{ contains(matrix.target, 'arm64') }}
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - name: make ${{ matrix.target }}
        # run_matrix.sh builds the whole package hermetically in Docker — no host
        # Go/Node/pnpm needed; it stages a source tarball and compiles inside the
        # sanitized build image.
        run: make ${{ matrix.target }}
      - name: Upload package artifact
        if: ${{ matrix.target != 'openwrt-smoke' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/packages/**
          if-no-files-found: warn
          retention-days: 14

  # release: on a vX.Y.Z tag, publish the built .deb/.rpm/.apk to the repo's
  # Releases page (the prominent, downloadable spot) — in addition to the
  # per-run Artifacts above. Only runs once the packages are green.
  release:
    name: release
    runs-on: ubuntu-24.04
    needs: [package]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      # Stage each package under a STABLE, version-less name
      # (wash-<distro>-<arch>.<ext>) AND its native versioned name. The
      # stable names are what the README's one-liners depend on via
      # https://github.com/sirmick/wash/releases/latest/download/<name> —
      # without this step a vX.Y.Z release would only carry the versioned
      # dpkg/rpm/apk names and those URLs would 404. The artifact layout is
      # artifacts/<row>/<distro>-<arch>/<pkg>, so the package's parent dir
      # is exactly "<distro>-<arch>".
      #
      # Every <distro>-<arch> dir holds TWO packages — wash and wash-login —
      # so the stable name has to carry the package identity as well as the
      # slug. Keying it on the slug alone let the second package clobber the
      # first, and which one survived was down to `find` order: v0.13.0
      # shipped wash-login as wash-fedora-40-amd64.rpm, v0.13.2 shipped it as
      # wash-ubuntu-24.04-amd64.deb. Both made the README's install one-liner
      # fail on an unmet `Depends: wash`.
      - name: Stage release assets (stable + versioned names)
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.apk' -o -name '*.tgz' \) \
            | sort | while read -r f; do
            slug=$(basename "$(dirname "$f")")     # e.g. ubuntu-24.04-amd64
            base=$(basename "$f")
            ext=${f##*.}
            # deb separates name from version with '_', rpm/apk with '-'.
            case "$base" in
              wash-login[-_]*) stem="wash-login-$slug" ;;   # wash-login-ubuntu-24.04-amd64.deb
              *)               stem="wash-$slug" ;;         # wash-ubuntu-24.04-amd64.deb
            esac
            cp "$f" "release/$stem.$ext"
            # Native names are not unique across distros of the same arch —
            # ubuntu-24.04-amd64 and debian-13-amd64 both build
            # wash_<ver>-1_amd64.deb. Publish the first (sorted: debian) and
            # say out loud which ones were dropped, rather than silently
            # overwriting. The stable names above carry every row unambiguously.
            if [ -e "release/$base" ]; then
              echo "note: native name $base already staged; not overwriting with $f"
            else
              cp "$f" "release/$base"              # native: wash_0.9.3-1_amd64.deb
            fi
          done
          echo "── release assets ──"; ls -1 release
      - name: Publish packages to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: false
