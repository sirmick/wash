# wash CI — build → test → package, the same `make` verbs you run locally.
#
#   unit     → make unit-test   (build + go vet + go test ./... + FE-unit + component)
#   e2e      → make e2e-test     (build test-app + Playwright)
#   package  → make <amd64>-<distro>-wash-package   (needs: tests pass first)
#
# amd64-only to start (no qemu emulation → fast). The kvm tiers (net-test /
# disks-test) can't run on GH runners and stay local. The browser-VM demo +
# its prebuild blobs live in demo.yml / prebuild.yml (unrelated to this pipeline).
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A new push to a branch/PR supersedes the in-flight run for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (go + fe)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: pnpm install (workspace)
        run: pnpm install --frozen-lockfile
      - name: make unit-test
        run: make unit-test

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: pnpm install (workspace)
        run: pnpm install --frozen-lockfile
      - name: pnpm install (e2e — standalone, outside the workspace)
        run: pnpm --dir e2e install --ignore-workspace --frozen-lockfile
      - name: Install Playwright Chromium (+ system deps)
        run: pnpm --dir e2e exec playwright install --with-deps chromium
      - name: make e2e-test
        run: make e2e-test
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  package:
    name: package
    runs-on: ubuntu-24.04
    needs: [unit, e2e]   # only package a green build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - amd64-ubuntu24-wash-package
          - amd64-debian13-wash-package
          - amd64-fedora40-wash-package
          - amd64-alpine321-wash-package
          - openwrt-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: make ${{ matrix.target }}
        # run_matrix.sh builds the whole package hermetically in Docker — no host
        # Go/Node/pnpm needed; it stages a source tarball and compiles inside the
        # sanitized build image.
        run: make ${{ matrix.target }}
      - name: Upload package artifact
        if: ${{ matrix.target != 'openwrt-smoke' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/packages/**
          if-no-files-found: warn
          retention-days: 14

  # release: on a vX.Y.Z tag, publish the built .deb/.rpm/.apk to the repo's
  # Releases page (the prominent, downloadable spot) — in addition to the
  # per-run Artifacts above. Only runs once the packages are green.
  release:
    name: release
    runs-on: ubuntu-24.04
    needs: [package]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Stage each package under a STABLE, version-less name
      # (wash-<distro>-<arch>.<ext>) AND its native versioned name. The
      # stable names are what the README's one-liners depend on via
      # https://github.com/sirmick/wash/releases/latest/download/<name> —
      # without this step a vX.Y.Z release would only carry the versioned
      # dpkg/rpm/apk names and those URLs would 404. The artifact layout is
      # artifacts/<row>/<distro>-<arch>/<pkg>, so the package's parent dir
      # is exactly "<distro>-<arch>".
      - name: Stage release assets (stable + versioned names)
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.apk' -o -name '*.tgz' \) | while read -r f; do
            slug=$(basename "$(dirname "$f")")     # e.g. ubuntu-24.04-amd64
            ext=${f##*.}
            cp "$f" "release/wash-$slug.$ext"      # stable: wash-ubuntu-24.04-amd64.deb
            cp "$f" "release/$(basename "$f")"     # native: wash_0.9.1-1_amd64.deb
          done
          echo "── release assets ──"; ls -1 release
      - name: Publish packages to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: false
