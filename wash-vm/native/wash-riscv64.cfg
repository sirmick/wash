/* wash-vm native TinyEMU config.
 *
 * Same kernel + firmware + rootfs as the browser build, just loaded
 * from local paths and consuming a raw ext2 instead of the chunked
 * blk manifest the WASM driver needs.
 */
{
    version: 1,
    machine: "riscv64",
    memory_size: 256,
    bios: "../image/dist/fw_jump.bin",
    kernel: "../image/dist/Image",
    cmdline: "loglevel=8 ignore_loglevel console=hvc0 root=/dev/vda rootfstype=ext2 rw",
    drive0: { file: "../image/dist/rootfs.ext2" },
}
