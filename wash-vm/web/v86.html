<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wash — online demo</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b0c10;
        color: #cfd0d4;
        font-family: ui-monospace, "JetBrains Mono", Menlo, monospace;
        overflow: hidden;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      /* Boot overlay: visible during VM boot, fades out once
         WASH_READY arrives. */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        background: #0b0c10;
        z-index: 10;
        transition: opacity 600ms ease;
      }
      #boot.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot-header {
        padding: 10px 16px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #8a8f9c;
        border-bottom: 1px solid #1a1c22;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      #boot-header .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ffae57;
        margin-right: 8px;
        animation: pulse 1.2s ease-in-out infinite;
      }
      #boot-header.ready .dot { background: #6fdc8c; animation: none; }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      #boot-term {
        flex: 1;
        padding: 8px;
        overflow: hidden;
      }
      /* v86's screen_container expects a specific child layout:
         a text-mode div followed by a canvas. We don't render
         either (the demo drives I/O entirely via virtio-console)
         but v86's init reads .firstChild and friends, so the
         structure must be present. Park it offscreen. */
      #v86-screen-container {
        position: absolute;
        left: -9999px;
        top: -9999px;
        width: 720px;
        height: 400px;
      }
      #v86-screen-container > div {
        white-space: pre;
        font: 14px monospace;
        line-height: 14px;
      }
      /* Wash shell mount target — mirrors cmd/wash-router/assets/
         index.html so apps see the same root environment. */
      #root { position: fixed; inset: 0; }

      /* Global keyframes used by wash apps for overlay/menu enter
         animations. Defined here so light-DOM-mounted apps can
         reference them by name. */
      @keyframes wash-fade-in {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes wash-pop-in {
        from { opacity: 0; transform: scale(0.96); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes wash-slide-up {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <!-- v86's screen_container: required structure even though we
           don't render it. v86 init walks .firstChild — both the
           text div AND the canvas must exist. Display is offscreen
           because everything user-facing goes through virtio-console. -->
      <div id="v86-screen-container">
        <div></div>
        <canvas></canvas>
      </div>
      <!-- Wash shell mount point. web/shell/src/main.tsx does:
           render(App, document.getElementById('root')!) — sits
           UNDER the boot overlay until WASH_READY fades it out. -->
      <div id="root"></div>
    </div>

    <!-- Boot overlay: xterm.js boot-log terminal, fades out on
         WASH_READY. -->
    <div id="boot">
      <div id="boot-header">
        <span><span class="dot"></span>booting wash</span>
        <span id="boot-stage">starting v86…</span>
      </div>
      <div id="boot-term"></div>
    </div>

    <!-- Vendor import map. The wash shell deliberately externalizes
         solid-js (+ a few others) into separate /vendor/* chunks so a
         single instance is loaded — Solid reactivity is broken by
         duplicates. Keep this in sync with web/shell/dist/index.html
         and web/shell/vite.config.ts's VENDOR_EXTERNAL list. The path
         prefix is /shell/vendor/ because the demo's vite plugin
         serves web/shell/dist/* under /shell/*. -->
    <script type="importmap">
    {
      "imports": {
        "solid-js": "/shell/vendor/solid.js",
        "solid-js/web": "/shell/vendor/solid-web.js",
        "solid-js/store": "/shell/vendor/solid-store.js",
        "@xterm/xterm": "/shell/vendor/xterm.js",
        "@xterm/addon-fit": "/shell/vendor/xterm-fit.js",
        "@wash/ui": "/shell/vendor/wash-ui.js"
      }
    }
    </script>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
