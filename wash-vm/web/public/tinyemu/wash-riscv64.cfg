/* Active cfg loaded by web/demo/index.html when no ?url= override is given.
   File paths are RELATIVE (no leading /) so config_load_file joins
   them against the cfg's URL — host-absolute paths trip Bellard's
   EMSCRIPTEN load_file abort. See docs/TINYEMU.md. */
{
    version: 1,
    machine: "riscv64",
    memory_size: 64,
    bios: "opensbi-fw_jump.bin",
    kernel: "wash-kernel.bin",
    cmdline: "loglevel=8 ignore_loglevel console=hvc0 root=/dev/vda rootfstype=ext2 rw random.trust_bootloader=1",
    drive0: { file: "wash-rootfs/blk.txt" },
    eth0: { driver: "user" },
}
