/* Active cfg loaded by web/demo/index.html when no ?url= override is given.
   File paths are RELATIVE (no leading /) so config_load_file joins
   them against the cfg's URL — host-absolute paths trip Bellard's
   EMSCRIPTEN load_file abort. See docs/TINYEMU.md.

   Rootfs: read-only squashfs on /dev/vda. The kernel has a baked-in
   initramfs (/init compiled from wash-vm/image/kernel/init.c) that
   mounts the squashfs read-only, lays a tmpfs upper layer over it via
   overlayfs, and switch_roots into the overlay before /sbin/init.
   Writes go to RAM only; page reload = fresh VM.

   Notice no root=/rootfstype= in cmdline — the initramfs owns that
   choice. The kernel just hands control to /init. */
{
    version: 1,
    machine: "riscv64",
    memory_size: 64,
    bios: "opensbi-fw_jump.bin",
    kernel: "wash-kernel.bin",
    cmdline: "loglevel=8 ignore_loglevel console=hvc0 printk.time=0 random.trust_bootloader=1",
    drive0: { file: "wash-rootfs/blk.txt" },
    eth0: { driver: "user" },
}
