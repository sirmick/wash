<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>wash</title>
  <link rel="icon" type="image/svg+xml" href="/wash-logo.svg">
  <!-- Shared runtime bundles. The shell + every dynamically-imported
       app bundle externalizes these specifiers and resolves them via
       this map. A single live instance per module is load-bearing —
       Solid reactivity (instanceof + signal-owner checks) breaks if
       two copies of solid-js end up loaded. Keep in sync with
       web/shell/build-vendor.mjs and each consumer's vite.config.ts
       externals list. -->
  <script type="importmap">
  {
    "imports": {
      "solid-js": "/vendor/solid.js",
      "solid-js/web": "/vendor/solid-web.js",
      "solid-js/store": "/vendor/solid-store.js",
      "@xterm/xterm": "/vendor/xterm.js",
      "@xterm/addon-fit": "/vendor/xterm-fit.js",
      "@wash/ui": "/vendor/wash-ui.js"
    }
  }
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 14px system-ui, sans-serif; overflow: hidden; }
    #root { position: fixed; inset: 0; }

    /* Global enter animations — apps use these via `animation:`
       on overlay/menu roots. Defined here in the shell document so
       all light-DOM-mounted apps can reference them by name. */
    @keyframes wash-fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes wash-pop-in {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes wash-slide-up {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Single-pass diagonal highlight that sweeps across an element
       once on mount. Used by the start menu on open. The overlay
       lives in a child div with pointer-events:none and is clipped
       by an overflow:hidden ancestor so the band can't escape. */
    @keyframes wash-shimmer-sweep {
      from { background-position: -120% 0; }
      to   { background-position:  220% 0; }
    }
    .wash-shimmer-sweep {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(105deg,
        transparent 30%,
        rgba(255, 255, 255, 0.12) 50%,
        transparent 70%);
      background-size: 200% 100%;
      background-position: -120% 0;
      animation: wash-shimmer-sweep 900ms ease-out 1 forwards;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
