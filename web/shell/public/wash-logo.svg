<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="wash">
  <defs>
    <!-- Petal: peach throat → pink mid → mauve tip -->
    <radialGradient id="petal" cx="50%" cy="100%" r="105%">
      <stop offset="0%"  stop-color="#fab387"/>
      <stop offset="22%" stop-color="#f2a5c4"/>
      <stop offset="58%" stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#9c7adf"/>
    </radialGradient>
    <!-- Soft inner glow at throat -->
    <radialGradient id="throat" cx="50%" cy="100%" r="55%">
      <stop offset="0%"  stop-color="#fde68a" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#fab387" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fab387" stop-opacity="0"/>
    </radialGradient>
    <!-- Shadow along the trailing edge of each petal for the fan/overlap -->
    <linearGradient id="overlap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#3a1d5e" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#3a1d5e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3a1d5e" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="stigma" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#f9a03b"/>
    </radialGradient>
    <!-- Single petal shape, pointing up. Hibiscus-style: wide rounded
         outer edge, narrow base, slight ruffle. -->
    <path id="p" d="M 0 -2
                    C -12 -6, -17 -16, -10 -25
                    C  -5 -29,  5 -29, 10 -25
                    C 17 -16, 12 -6,  0 -2 Z"/>
  </defs>

  <g transform="translate(32 33)">
    <!-- 5 petals, fanned -->
    <g>
      <use href="#p" fill="url(#petal)" transform="rotate(0)"/>
      <use href="#p" fill="url(#petal)" transform="rotate(72)"/>
      <use href="#p" fill="url(#petal)" transform="rotate(144)"/>
      <use href="#p" fill="url(#petal)" transform="rotate(216)"/>
      <use href="#p" fill="url(#petal)" transform="rotate(288)"/>
    </g>
    <!-- Overlap shadow on the leading edge (rotates with each petal) -->
    <g opacity="0.85">
      <use href="#p" fill="url(#overlap)" transform="rotate(0)"/>
      <use href="#p" fill="url(#overlap)" transform="rotate(72)"/>
      <use href="#p" fill="url(#overlap)" transform="rotate(144)"/>
      <use href="#p" fill="url(#overlap)" transform="rotate(216)"/>
      <use href="#p" fill="url(#overlap)" transform="rotate(288)"/>
    </g>
    <!-- Warm throat glow -->
    <circle r="9" fill="url(#throat)"/>

    <!-- Stamen tube + stigma tips, leaning forward for a 3/4 feel -->
    <g transform="rotate(-18)">
      <path d="M 0 0 C 1.2 -6, 1.2 -12, 0.5 -19"
            stroke="#f9e2af" stroke-width="1.6"
            stroke-linecap="round" fill="none" opacity="0.95"/>
      <g fill="url(#stigma)">
        <circle cx="0.5" cy="-19.5" r="1.6"/>
        <circle cx="-1.6" cy="-17.5" r="1.3"/>
        <circle cx="2.4" cy="-17"   r="1.3"/>
        <circle cx="-0.6" cy="-20.8" r="1.2"/>
        <circle cx="1.8" cy="-20"   r="1.2"/>
      </g>
    </g>
  </g>
</svg>
