<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>wash — sign in</title>
<style>
  :root { color-scheme: dark; }
  body {
    background: #0e1116; color: #d9dde3;
    font: 14px/1.4 system-ui, -apple-system, sans-serif;
    min-height: 100vh; margin: 0;
    display: grid; place-items: center;
    padding: 2rem 1rem;
  }
  .card {
    background: #161b22; border: 1px solid #2a313a;
    padding: 1.8rem 2rem; border-radius: 8px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.04), 0 8px 24px rgba(0,0,0,0.3);
    width: 100%; max-width: 22rem;
  }
  .logo {
    display: block; margin: 0 auto 1rem auto;
    width: 64px; height: 64px;
  }
  h1 {
    margin: 0 0 1.2rem 0;
    text-align: center;
    font-size: 0.95rem; font-weight: 500; letter-spacing: 0.04em;
    color: #8b949e; text-transform: lowercase;
  }
  label { display: block; margin: 0.6rem 0 0.25rem 0; color: #8b949e; font-size: 0.82rem; }
  input[type=text], input[type=password], select {
    width: 100%; box-sizing: border-box;
    background: #0d1117; color: #d9dde3;
    border: 1px solid #30363d; border-radius: 4px;
    padding: 0.55rem 0.7rem; font: inherit;
  }
  select {
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, #6e7681 50%),
                      linear-gradient(135deg, #6e7681 50%, transparent 50%);
    background-position: calc(100% - 16px) center, calc(100% - 11px) center;
    background-size: 5px 5px;
    background-repeat: no-repeat;
    padding-right: 1.8rem;
  }
  input:focus, select:focus { outline: none; border-color: #5b8eff; }
  .actions {
    margin-top: 1.2rem;
    display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;
  }
  .actions button {
    border-radius: 4px;
    padding: 0.6rem 0.8rem; font: inherit; font-weight: 500;
    cursor: pointer;
    border: 1px solid #30363d;
  }
  .actions button.primary {
    background: #2c5fd9; color: white; border-color: #3a6ee8;
  }
  .actions button.primary:hover { background: #3a6ee8; }
  .actions button.secondary {
    background: #21262d; color: #d9dde3;
  }
  .actions button.secondary:hover { background: #30363d; }
  .err {
    margin-top: 0.8rem;
    background: #4a1a1a; color: #ffb8b8;
    border: 1px solid #6e2424; border-radius: 4px;
    padding: 0.4rem 0.6rem; font-size: 0.85rem;
  }
</style>
<body>
  <form class="card" method="post" action="/auth" autocomplete="off">
    <img class="logo" src="/wash-logo.svg" alt="wash">
    <h1>wash — sign in</h1>

    {{if .Error}}<div class="err">{{.Error}}</div>{{end}}

    {{if .Users}}
      <label for="u">Username</label>
      <select id="u" name="user" autocomplete="username" required {{if not .PreselectUser}}autofocus{{end}}>
        {{if not .PreselectUser}}<option value="" disabled selected>Choose user…</option>{{end}}
        {{range .Users}}
          <option value="{{.Name}}" {{if eq $.PreselectUser .Name}}selected{{end}}>
            {{.Name}}{{if .Display}} — {{.Display}}{{end}}
          </option>
        {{end}}
      </select>
    {{else}}
      <label for="u">Username</label>
      <input id="u" type="text" name="user" autocomplete="username" required
             value="{{.PreselectUser}}"
             {{if not .PreselectUser}}autofocus{{end}}>
    {{end}}

    <label for="p">Password</label>
    <input id="p" type="password" name="password" autocomplete="current-password" required
           {{if .PreselectUser}}autofocus{{end}}>

    <div class="actions">
      <button type="submit" class="primary" name="action" value="signin">Sign in</button>
      <button type="submit" class="secondary" name="action" value="new">New session</button>
    </div>
  </form>
</body>
</html>
