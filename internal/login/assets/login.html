<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>wash — log in</title>
<style>
  :root { color-scheme: dark; }
  body {
    background: #0e1116; color: #d9dde3;
    font: 14px/1.4 system-ui, -apple-system, sans-serif;
    min-height: 100vh; margin: 0;
    display: grid; place-items: center;
  }
  .card {
    background: #161b22; border: 1px solid #2a313a;
    padding: 2rem 2.4rem; border-radius: 8px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.04), 0 8px 24px rgba(0,0,0,0.3);
    min-width: 22rem;
  }
  h1 { margin: 0 0 1.4rem 0; font-size: 1.05rem; font-weight: 600; letter-spacing: 0.02em; }
  h1 .sub { color: #6e7681; font-weight: 400; margin-left: 0.4rem; }
  label { display: block; margin: 0.6rem 0 0.2rem 0; color: #8b949e; font-size: 0.85rem; }
  input[type=text], input[type=password] {
    width: 100%; box-sizing: border-box;
    background: #0d1117; color: #d9dde3;
    border: 1px solid #30363d; border-radius: 4px;
    padding: 0.5rem 0.7rem; font: inherit;
  }
  input:focus { outline: none; border-color: #5b8eff; }
  button {
    margin-top: 1.2rem; width: 100%;
    background: #2c5fd9; color: white;
    border: none; border-radius: 4px;
    padding: 0.6rem 0.8rem; font: inherit; font-weight: 500;
    cursor: pointer;
  }
  button:hover { background: #3a6ee8; }
  .err {
    margin-top: 0.8rem;
    background: #4a1a1a; color: #ffb8b8;
    border: 1px solid #6e2424; border-radius: 4px;
    padding: 0.4rem 0.6rem; font-size: 0.85rem;
  }
</style>
<body>
  <form class="card" method="post" action="/auth" autocomplete="off">
    <h1>wash <span class="sub">— log in</span></h1>
    {{if .Error}}<div class="err">{{.Error}}</div>{{end}}
    <label for="u">Username</label>
    <input id="u" type="text" name="user" autocomplete="username" autofocus required>
    <label for="p">Password</label>
    <input id="p" type="password" name="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
