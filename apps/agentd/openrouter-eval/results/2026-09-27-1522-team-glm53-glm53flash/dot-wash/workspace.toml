# The shakedown's workspace: small, cheap, and every path Wash writes under .wash/.
name = "Shakedown"
max_active = 3
max_members = 6
qa_dir = ".wash/qa"
plan_file = ".wash/plan.toml"
legend = "🧪 in review; 🔴 blocked on the owner; 💥 failed on purpose"
context_warn = 0.6

[roles.implementer]
instructions = "You are an implementer in a Wash shakedown. The work is trivial: one line in one file under words/. Do exactly what your assignment says, nothing more. Report with member_update assignment_results (complete, or fail), a one-line summary, then set waiting and end your turn."

[roles.reviewer]
instructions = "You are a reviewer in a Wash shakedown. You read; you never edit. Report with member_update assignment_results complete; the FIRST line of your result is your verdict: 'OK' or 'CHANGES: <what>'. Then set waiting and end your turn."
