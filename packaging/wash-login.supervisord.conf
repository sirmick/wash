; EXAMPLE supervisord program for the wash multi-user login front door, for
; hosts without systemd or OpenRC (containers, MikroTik RouterOS OCI, etc.).
;
; This file is shipped as documentation only — it is installed under
; /usr/share/wash-login/ and is NOT active. To use it, copy the [program]
; stanza into your supervisor config (typically /etc/supervisor/conf.d/ on
; Debian/Ubuntu, /etc/supervisord.d/ on RHEL/Alpine) and `supervisorctl
; reread && supervisorctl update`.
;
; Parity with the shipped systemd unit (packaging/wash-login.service) and
; OpenRC service (alpine/wash-login.initd):
;
;   * Args come from the SAME single-source env file, /etc/default/wash-login
;     (WASH_LOGIN_ARGS) — so you configure the cookie policy / bind / limits in
;     one place, not hardcoded here. The shipped default passes
;     --allow-insecure-cookie (plain-HTTP login); put wash behind TLS and switch
;     to --cookie-secure for anything exposed beyond a trusted LAN.
;
;   * wash-login creates its runtime root /run/wash itself on start (mode 2770,
;     group wash), so no pre-step is needed here.
;
; This example runs wash-login as ROOT, which is the simplest robust choice for
; a container where the image is the trust boundary: root already holds
; cap_setuid/cap_setgid/cap_kill (so no setcap is required even if the image
; build dropped the binary's file-capability xattr) and can read /etc/shadow for
; the default auth backend. Uid-switching into target users works as-is.
;
; HARDENED ALTERNATIVE (least privilege, matching systemd's User=wash-system):
; add `user=wash-system` below. That requires (a) a supervisor build new enough
; to call initgroups, so wash-system picks up its supplementary `shadow` and
; `wash` groups, and (b) the binary keeping its file-capabilities — the package
; postinst sets them, but re-run this if your image build stripped the xattr:
;     setcap 'cap_setuid,cap_setgid,cap_kill+ep' /usr/bin/wash-login

[program:wash-login]
command=/bin/sh -c '. /etc/default/wash-login; exec /usr/bin/wash-login $WASH_LOGIN_ARGS'
autostart=true
autorestart=true
startsecs=2
startretries=3
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/var/log/wash-login.log
stderr_logfile=/var/log/wash-login.log
